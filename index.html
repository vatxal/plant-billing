<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Bill</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 10px;
  background: #f5f5f5;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 6px;
  font-size: 14px;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

th, td {
  border: 1px solid #444;
  padding: 6px;
  text-align: center;
  font-size: 14px;
}

th {
  background: #eaeaea;
}

th:nth-child(1), td:nth-child(1) { width: 42%; text-align: left; }
th:nth-child(2), td:nth-child(2) { width: 13%; }
th:nth-child(3), td:nth-child(3) { width: 15%; }
th:nth-child(4), td:nth-child(4) { width: 15%; }
th:nth-child(5), td:nth-child(5) { width: 15%; }

button {
  padding: 10px;
  font-size: 16px;
  margin: 5px 0;
  width: 100%;
}
</style>
</head>

<body>

<h3>Customer Name</h3>
<input id="customerName" placeholder="Enter customer name">

<h3>Date</h3>
<input id="orderDate" type="date">

<br><br>

<!-- 🔁 RECENT ORDERS -->
<h3>Recent Orders</h3>
<select id="recentOrders" onchange="loadOrder()">
  <option value="">-- Select Order --</option>
</select>

<br><br>

<div id="captureArea">
  <table id="billTable">
    <tr>
      <th>Plant Name</th>
      <th>Qty</th>
      <th>Price</th>
      <th>Height (Ft)</th>
      <th>Total</th>
    </tr>
  </table>

  <h3 id="finalTotal">Grand Total: 0</h3>
</div>

<button onclick="addRow()">➕ Add Row</button>
<button onclick="capture(false)">Submit (English)</button>
<button onclick="capture(true)">Submit (Gujarati)</button>

<script>
const table = document.getElementById("billTable");
const customerName = document.getElementById("customerName");
const orderDate = document.getElementById("orderDate");
const recentDropdown = document.getElementById("recentOrders");

function addRow() {
  const r = table.insertRow();
  for (let i = 0; i < 5; i++) {
    const c = r.insertCell();
    const inp = document.createElement("input");
    inp.type = (i === 1 || i === 2 || i === 3) ? "number" : "text";
    inp.oninput = calc;
    c.appendChild(inp);
  }
}

for (let i = 0; i < 10; i++) addRow();

function calc() {
  let grand = 0;
  for (let i = 1; i < table.rows.length; i++) {
    const r = table.rows[i];
    const q = Number(r.cells[1].firstChild.value) || 0;
    const p = Number(r.cells[2].firstChild.value) || 0;
    const t = q * p;
    r.cells[4].firstChild.value = t;
    grand += t;
  }
  document.getElementById("finalTotal").innerText =
    "Grand Total: " + grand;
}

/* SAVE ORDER */
function saveOrder() {
  const name = customerName.value.trim();
  const date = orderDate.value;

  if (!name || !date) return;

  let rows = [];

  for (let i = 1; i < table.rows.length; i++) {
    const r = table.rows[i];
    rows.push({
      plant: r.cells[0].firstChild.value,
      qty: r.cells[1].firstChild.value,
      price: r.cells[2].firstChild.value,
      height: r.cells[3].firstChild.value
    });
  }

  let orders = JSON.parse(localStorage.getItem("orders") || "[]");

  orders.unshift({ name, date, rows });

  if (orders.length > 10) orders = orders.slice(0, 10);

  localStorage.setItem("orders", JSON.stringify(orders));

  loadRecentDropdown();
}

/* LOAD DROPDOWN */
function loadRecentDropdown() {
  let orders = JSON.parse(localStorage.getItem("orders") || "[]");

  recentDropdown.innerHTML = '<option value="">-- Select Order --</option>';

  orders.forEach((o, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.text = o.name + " - " + o.date;
    recentDropdown.appendChild(opt);
  });
}

/* LOAD ORDER INTO TABLE */
function loadOrder() {
  const index = recentDropdown.value;
  if (index === "") return;

  let orders = JSON.parse(localStorage.getItem("orders") || "[]");
  const o = orders[index];

  customerName.value = o.name;
  orderDate.value = o.date;

  // clear rows
  while (table.rows.length > 1) table.deleteRow(1);

  o.rows.forEach(row => {
    const r = table.insertRow();
    [row.plant, row.qty, row.price, row.height, ""].forEach(val => {
      const c = r.insertCell();
      const inp = document.createElement("input");
      inp.value = val;
      inp.oninput = calc;
      c.appendChild(inp);
    });
  });

  calc();
}

/* Gujarati */
function toGujarati(text) {
  const map = {
    "areca":"અરેકા",
    "bahumia":"બહુમિયા",
    "coconut":"કોકોનટ"
  };

  return text.split(" ").map(w => {
    const k = w.toLowerCase();
    return map[k] || w;
  }).join(" ");
}

async function capture(guj) {
  const name = customerName.value.trim();
  if (!name) {
    alert("Enter customer name");
    return;
  }

  saveOrder(); // 🔥 SAVE HERE

  const area = document.getElementById("captureArea");
  const originalWidth = area.style.width;
  area.style.width = "900px";

  if (guj) {
    for (let i = 1; i < table.rows.length; i++) {
      const input = table.rows[i].cells[0].firstChild;
      input.dataset.eng = input.value;
      input.value = toGujarati(input.value);
    }
  }

  const canvas = await html2canvas(area, { scale: 2 });
  const blob = await new Promise(r => canvas.toBlob(r));

  let url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name + (guj ? "_Gujarati" : "") + ".png";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  area.style.width = originalWidth;

  if (guj) {
    for (let i = 1; i < table.rows.length; i++) {
      const input = table.rows[i].cells[0].firstChild;
      if (input.dataset.eng) input.value = input.dataset.eng;
    }
  }
}

/* INIT */
loadRecentDropdown();
</script>

</body>
</html>
